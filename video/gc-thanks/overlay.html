<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tompedia Lab GC thank-you overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=block" rel="stylesheet">
<style>
  :root {
    --purple: #825dab;
    --purple-dark: #5b3d80;
    --lavender: #efe7f8;
    --yellow: #ffd23f;
    --ink: #2b2233;
    --gc-blue: #1e2b99;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  body { font-family: "M PLUS Rounded 1c", sans-serif; color: var(--ink); position: relative; }
  .abs { position: absolute; }
  .center { left: 0; right: 0; text-align: center; }
  .scene { inset: 0; opacity: 0; overflow: hidden; }
  .white { background: #fff; }
  .lav { background: var(--lavender); }
  .pill {
    background: #fff; color: var(--purple-dark); font-weight: 900; border-radius: 80px;
    padding: 18px 48px; white-space: nowrap; box-shadow: 0 10px 0 rgba(91,61,128,.3);
  }
  .photo { inset: 0; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tonpei { position: absolute; }
  em { font-style: normal; }
  .hl { background: linear-gradient(transparent 62%, var(--yellow) 62%); padding: 0 8px; }

  /* opening */
  #open-logo { width: 900px; left: 90px; top: 860px; }

  /* thanks */
  #thanks-label { top: 150px; font-size: 64px; font-weight: 900; color: var(--gc-blue); }
  #thanks-post { width: 600px; left: 240px; top: 280px; border-radius: 28px; box-shadow: 0 26px 60px rgba(43,34,51,.3); }
  #thanks-votes { top: 1050px; font-weight: 900; color: var(--purple); line-height: 1; white-space: nowrap; }
  #thanks-votes .num { font-size: 230px; letter-spacing: -4px; }
  #thanks-votes .u { font-size: 100px; }
  #thanks-votes .s { font-size: 64px; color: var(--ink); margin-left: 6px; }
  #thanks-msg { top: 1380px; font-size: 86px; font-weight: 900; color: var(--purple-dark); white-space: nowrap; }
  #tp-cheer { width: 330px; left: 740px; top: 1600px; }

  /* result */
  #result-title { top: 230px; left: 50%; font-size: 56px; background: var(--purple); color: #fff; }
  .rcard {
    left: 90px; right: 90px; height: 230px; background: #fff; border: 6px solid var(--purple); border-radius: 48px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 60px;
    box-shadow: 0 16px 40px rgba(91,61,128,.22);
  }
  .rcard .k { font-size: 54px; font-weight: 800; color: var(--purple-dark); }
  .rcard .v { font-size: 110px; font-weight: 900; color: var(--purple); white-space: nowrap; }
  .rcard .v small { font-size: 56px; margin-left: 4px; }
  #result-msg { top: 1330px; font-size: 76px; font-weight: 900; line-height: 1.35; color: var(--purple-dark); }

  /* app: ffmpeg puts the app recording under this layer at x305 y430 470x962; the scene has a hole there */
  #sc-app.hole {
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920'><path fill-rule='evenodd' d='M0 0H1080V1920H0Z M351 430H729A46 46 0 0 1 775 476V1346A46 46 0 0 1 729 1392H351A46 46 0 0 1 305 1346V476A46 46 0 0 1 351 430Z'/></svg>");
  }
  #app-head { top: 130px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  #app-head .pill { font-size: 46px; background: var(--purple); color: #fff; }
  #app-head img { height: 120px; }
  #bezel {
    left: 289px; top: 414px; width: 502px; height: 994px; border-radius: 62px;
    border: 16px solid #1d1626; box-shadow: 0 30px 70px rgba(43,34,51,.45);
  }
  #app-card {
    left: 60px; right: 60px; top: 1470px; background: #fff; border-radius: 48px; border: 6px solid var(--purple);
    padding: 34px 30px 40px; text-align: center; box-shadow: 0 20px 50px rgba(91,61,128,.3);
    font-size: 54px; font-weight: 900; white-space: nowrap;
  }
  #app-card .num { font-size: 140px; color: var(--purple); letter-spacing: -2px; }

  /* events */
  #sc-events { background: linear-gradient(160deg, #a585cc, #5b3d80); }
  #events-title { top: 150px; left: 50%; font-size: 64px; }
  .cover { width: 400px; border-radius: 18px; box-shadow: 0 18px 40px rgba(0,0,0,.45); border: 6px solid #fff; }

  /* MVV */
  #mvv-shade { inset: 0; background: rgba(43,34,51,.66); }
  .tag-label { font-size: 40px; font-weight: 800; letter-spacing: 8px; color: rgba(255,255,255,.75); }
  #mission { top: 300px; color: #fff; font-weight: 900; line-height: 1.3; }
  #mission .a { font-size: 44px; display: block; margin-top: 18px; white-space: nowrap; }
  #mission .b { font-size: 96px; display: block; margin-top: 14px; }
  #mission .b em { color: var(--yellow); }
  #value-label { top: 1060px; }
  .value { left: 50%; font-size: 76px; width: 860px; text-align: center; }
  .value small { display: block; font-size: 34px; font-weight: 800; color: #6d6177; margin-top: 4px; white-space: nowrap; }

  /* end */
  #end-photo { left: 60px; right: 60px; top: 200px; height: 720px; border-radius: 40px; overflow: hidden; box-shadow: 0 26px 60px rgba(43,34,51,.3); }
  #end-photo img { width: 100%; height: 100%; object-fit: cover; }
  #end-msg { top: 990px; font-size: 84px; font-weight: 900; line-height: 1.3; color: var(--purple-dark); }
  #end-logo { width: 760px; left: 160px; top: 1260px; }
  #end-cta {
    top: 1400px; left: 50%; background: var(--purple); color: #fff; font-size: 54px; font-weight: 800;
    padding: 24px 64px; border-radius: 80px; white-space: nowrap;
  }
  #point { width: 420px; left: 640px; top: 1520px; }
</style>
</head>
<body>

<div id="sc-open" class="scene abs white">
  <img id="open-logo" class="abs" src="ASSETS/labo_logo.png" alt="とんペディア_ラボ">
</div>

<div id="sc-thanks" class="scene abs lav">
  <div id="thanks-label" class="abs center">Giving Campaign 2026</div>
  <img id="thanks-post" class="abs" src="ASSETS/gc_post.png" alt="">
  <div id="thanks-votes" class="abs center"><span class="num" data-count="319">0</span><span class="u">票</span><span class="s">もの応援</span></div>
  <div id="thanks-msg" class="abs center"><span class="hl">ありがとうございました！</span></div>
  <img id="tp-cheer" class="tonpei" src="ASSETS/tonpei_cheer.png" alt="">
</div>

<div id="sc-result" class="scene abs white">
  <div id="result-title" class="pill abs">Giving Campaign 2026 の結果</div>
  <div class="rcard abs" style="top:430px"><span class="k">応援</span><span class="v">319<small>票</small></span></div>
  <div class="rcard abs" style="top:700px"><span class="k">順位</span><span class="v">25<small>位</small></span></div>
  <div class="rcard abs" style="top:970px"><span class="k">支援金</span><span class="v">8,544<small>円</small></span></div>
  <div id="result-msg" class="abs center">みなさんの1票が、<br><span class="hl">大きな力</span>になりました</div>
</div>

<div id="sc-app" class="scene abs lav">
  <div id="app-head" class="abs">
    <div class="pill">いつも使ってくれて、ありがとう</div>
    <img src="ASSETS/wordmark.png" alt="とんペディア">
  </div>
  <div id="bezel" class="abs"></div>
  <div id="app-card" class="abs"><span class="num" data-count="6720">0</span>人が利用中</div>
</div>

<div id="sc-events" class="scene abs">
  <div id="events-title" class="pill abs">企業と連携したイベント</div>
  <img class="cover abs" src="ASSETS/reports/r1.png" alt="">
  <img class="cover abs" src="ASSETS/reports/r2.png" alt="">
  <img class="cover abs" src="ASSETS/reports/r3.png" alt="">
  <img class="cover abs" src="ASSETS/reports/r4.png" alt="">
  <img class="cover abs" src="ASSETS/reports/r5.png" alt="">
  <img class="cover abs" src="ASSETS/reports/r6.png" alt="">
  <img class="cover abs" src="ASSETS/reports/r7.png" alt="">
  <img class="cover abs" src="ASSETS/reports/r8.png" alt="">
</div>

<div id="sc-mvv" class="scene abs">
  <div class="photo abs"><img src="ASSETS/photos/group.jpg" alt=""></div>
  <div id="mvv-shade" class="abs"></div>
  <div id="mission" class="abs center">
    <span class="tag-label">MISSION</span>
    <span class="a">すべての東北大生に、最高の価値を届けて</span>
    <span class="b"><em>東北大学を</em><br><em>世界一おもしろい</em><br>大学に</span>
  </div>
  <div id="value-label" class="tag-label abs center">VALUE</div>
  <div class="value pill abs" style="top:1140px">つくろう！<small>身の回りの人をプロダクトの力で幸せに</small></div>
  <div class="value pill abs" style="top:1350px">まなぼう！<small>実践的なスキルを学び、仲間と成長</small></div>
  <div class="value pill abs" style="top:1560px">つながろう！<small>違う視点を持った人とたくさんつながる</small></div>
</div>

<div id="sc-end" class="scene abs white">
  <div id="end-photo" class="abs"><img src="ASSETS/photos/group.jpg" alt=""></div>
  <div id="end-msg" class="abs center">これからも<br><span class="hl">よろしくお願いします！</span></div>
  <img id="end-logo" class="abs" src="ASSETS/labo_logo.png" alt="とんペディア_ラボ">
  <div id="end-cta" class="abs">くわしくはホームページへ</div>
  <img id="point" class="abs" src="ASSETS/tonpei_point.png" alt="">
</div>

<script>
// All motion is a pure function of time so every frame renders deterministically.
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, t0, dur) => clamp((t - t0) / dur);
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeOutBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

// scene windows [start, end] in seconds; OPEN is the logo opening, passed by build.sh as ?open=
const OPEN = +(new URLSearchParams(location.search).get('open') ?? 1.8);
const S = {
  open:   [0, OPEN],
  thanks: [OPEN + 0.0, OPEN + 5.0],
  result: [OPEN + 5.0, OPEN + 8.5],
  app:    [OPEN + 8.5, OPEN + 12.0],
  events: [OPEN + 12.0, OPEN + 14.5],
  mvv:    [OPEN + 14.5, OPEN + 21.0],
  end:    [OPEN + 21.0, OPEN + 24.21],
};
const at = (scene, dt) => S[scene][0] + dt;
const FADE = 0.3;
const VOTES_AT = 0.9, COUNT = 1.2, VALUES_AT = 3.0;

// sound cues [time, sound, gain, pitch]; build.sh reads them via window.SFX_CUES.
// n1..n6 are the narration recordings (N1..N6 in the storyboard); missing ones are silent.
const SFX_CUES = [];
const cue = (t, name, gain = 1, pitch = 1) => SFX_CUES.push([+t.toFixed(3), name, gain, pitch]);
cue(at('thanks', 0.15), 'n1', 1);
cue(at('thanks', VOTES_AT + COUNT - 0.1), 'ding', 0.5);
cue(at('result', 0.15), 'n2', 1);
cue(at('app', 0.15), 'n3', 1);
cue(at('events', 0.15), 'n4', 1);
cue(at('mvv', 0.15), 'n5', 1);
cue(at('end', 0.05), 'chime', 0.5);
cue(at('end', 0.08), 'sparkle', 0.3);
cue(at('end', 0.2), 'n6', 1.2);
window.SFX_CUES = SFX_CUES;

// a scene fades in over the previous one and stays opaque until the next has fully covered it
function sceneOpacity(t, [a, b], first) {
  const h = FADE / 2;
  if (t < a - h || t >= b + h) return 0;
  return first ? 1 : prog(t, a - h, FADE);
}
function pop(el, t, t0, { dur = 0.45, from = 0.4, dy = 0, extra = '' } = {}) {
  const p = prog(t, t0, dur);
  el.style.opacity = clamp(p * 3);
  el.style.transform = `${extra} translateY(${(1 - easeOut(p)) * dy}px) scale(${from + (1 - from) * easeOutBack(p)})`;
}
function slideUp(el, t, t0, { dur = 0.5, dy = 300, extra = '' } = {}) {
  const p = easeOut(prog(t, t0, dur));
  el.style.opacity = clamp(p * 2);
  el.style.transform = `${extra} translateY(${(1 - p) * dy}px)`;
}
function countUp(el, t, t0, dur) {
  el.textContent = Math.round(+el.dataset.count * easeOut(prog(t, t0, dur))).toLocaleString('en-US');
}
function bob(el, t, t0, side = 1) { el.style.transform += ` rotate(${side * Math.sin((t - t0) * 5) * 4}deg)`; }

// event report covers: scattered two-column stack, each slightly tilted
const COVERS = [[80, 300, -5], [590, 340, 4], [100, 640, 3], [580, 690, -4], [70, 990, -3], [600, 1030, 5], [110, 1330, 4], [570, 1370, -3]];
$$('.cover').forEach((el, i) => { el.style.left = COVERS[i][0] + 'px'; el.style.top = COVERS[i][1] + 'px'; });

function setTime(t) {
  Object.keys(S).forEach((n, i) => { $(`#sc-${n}`).style.opacity = sceneOpacity(t, S[n], i === 0); });
  $('#sc-app').classList.toggle('hole', t >= S.app[0] - FADE && t < S.app[1] + FADE);

  // opening
  pop($('#open-logo'), t, 0.15, { from: 0.3, dur: 0.55 });

  // thanks
  slideUp($('#thanks-label'), t, at('thanks', 0.1), { dy: 50, dur: 0.4 });
  pop($('#thanks-post'), t, at('thanks', 0.25), { from: 0.6, dy: 80, extra: 'rotate(-3deg)' });
  slideUp($('#thanks-votes'), t, at('thanks', VOTES_AT - 0.2), { dy: 80, dur: 0.4 });
  countUp($('#thanks-votes .num'), t, at('thanks', VOTES_AT), COUNT);
  pop($('#thanks-msg'), t, at('thanks', 2.4), { from: 0.5, dy: 60 });
  pop($('#tp-cheer'), t, at('thanks', 2.7), { from: 0.2, dy: 60, dur: 0.5 });
  bob($('#tp-cheer'), t, at('thanks', 2.7));

  // result
  pop($('#result-title'), t, at('result', 0.05), { extra: 'translateX(-50%)', from: 0.5 });
  $$('.rcard').forEach((el, i) => slideUp(el, t, at('result', 0.25 + i * 0.25), { dy: 120, dur: 0.45 }));
  slideUp($('#result-msg'), t, at('result', 1.4), { dy: 80, dur: 0.5 });

  // app
  slideUp($('#app-head'), t, at('app', 0.1), { dy: 60, dur: 0.45 });
  slideUp($('#app-card'), t, at('app', 0.3), { dy: 200 });
  countUp($('#app-card .num'), t, at('app', 0.4), 1.0);

  // events
  pop($('#events-title'), t, at('events', 0.05), { extra: 'translateX(-50%)', from: 0.5 });
  $$('.cover').forEach((el, i) => pop(el, t, at('events', 0.25 + i * 0.15), { from: 0.6, dy: 120, dur: 0.4, extra: `rotate(${COVERS[i][2]}deg)` }));

  // MVV: mission first, then the three values
  $('#sc-mvv .photo').style.transform = `scale(${1 + 0.08 * prog(t, at('mvv', -0.2), 6.9)})`;
  slideUp($('#mission'), t, at('mvv', 0.2), { dy: 80, dur: 0.6 });
  slideUp($('#value-label'), t, at('mvv', VALUES_AT - 0.2), { dy: 40, dur: 0.4 });
  $$('.value').forEach((el, i) => pop(el, t, at('mvv', VALUES_AT + i * 0.45), { extra: 'translateX(-50%)', from: 0.5, dy: 40 }));

  // end
  pop($('#end-photo'), t, at('end', 0.05), { from: 0.85 });
  slideUp($('#end-msg'), t, at('end', 0.3), { dy: 80, dur: 0.5 });
  pop($('#end-logo'), t, at('end', 0.6), { from: 0.6 });
  pop($('#end-cta'), t, at('end', 0.9), { extra: 'translateX(-50%)', from: 0.5 });
  slideUp($('#point'), t, at('end', 1.0), { dy: 500, dur: 0.6 });
  $('#point').style.transform += ` rotate(${Math.sin(t * 5) * 3}deg)`;
}
window.setTime = setTime;
</script>
</body>
</html>
