<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tompedia app intro: Giving Campaign end card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=block" rel="stylesheet">
<style>
  :root { --purple: #825dab; --purple-dark: #5b3d80; --yellow: #ffd23f; --ink: #2b2233; --gc-blue: #1e2b99; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
  body { font-family: "M PLUS Rounded 1c", sans-serif; color: var(--ink); position: relative; }
  .abs { position: absolute; }

  #title { top: 210px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  #title .row { display: flex; align-items: flex-end; gap: 10px; }
  #title img { width: 720px; }
  #title .ha { font-size: 70px; font-weight: 900; line-height: 1; }
  #title .gc { font-size: 66px; font-weight: 900; color: var(--purple-dark); white-space: nowrap; }
  #title .gc b { color: var(--gc-blue); }   /* the GC post's blue */

  #post {
    width: 760px; left: 160px; top: 540px; border-radius: 28px;
    box-shadow: 0 26px 60px rgba(43, 34, 51, .3);
  }

  #vote {
    top: 1560px; left: 50%; white-space: nowrap; font-size: 104px; font-weight: 900; color: var(--purple);
  }
  #vote span { background: linear-gradient(transparent 62%, var(--yellow) 62%); padding: 0 10px; }
</style>
</head>
<body>
<div id="title" class="abs">
  <div class="row"><img src="ASSETS/labo_logo.png" alt="とんペディア_ラボ"><span class="ha">は</span></div>
  <div class="gc"><b>Giving Campaign 2026</b>に参加中</div>
</div>
<img id="post" class="abs" src="ASSETS/gc_post.png" alt="">
<div id="vote" class="abs"><span>投票お願いします！</span></div>

<script>
// Same conventions as overlay.html: motion is a pure function of time.
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, t0, dur) => clamp((t - t0) / dur);
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeOutBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const $ = s => document.querySelector(s);

function pop(el, t, t0, { dur = 0.45, from = 0.4, extra = '' } = {}) {
  const p = prog(t, t0, dur);
  el.style.opacity = clamp(p * 3);
  el.style.transform = `${extra} scale(${from + (1 - from) * easeOutBack(p)})`;
}
function slideUp(el, t, t0, { dur = 0.5, dy = 120 } = {}) {
  const p = easeOut(prog(t, t0, dur));
  el.style.opacity = clamp(p * 2);
  el.style.transform = `translateY(${(1 - p) * dy}px)`;
}

// t is seconds from the start of the card
window.SFX_CUES = [[0.1, 'chime', 0.6, 1], [0.13, 'sparkle', 0.35, 1]];
window.setTime = t => {
  slideUp($('#title'), t, 0.1, { dy: 60, dur: 0.45 });
  slideUp($('#post'), t, 0.35, { dy: 160, dur: 0.55 });
  pop($('#vote'), t, 0.85, { extra: 'translateX(-50%)', from: 0.5 });
};
</script>
</body>
</html>
